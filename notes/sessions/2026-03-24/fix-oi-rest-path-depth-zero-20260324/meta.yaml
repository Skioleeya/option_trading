notes:
  - "ATM decay now emits a separate diagnostic record when raw pct computation cannot proceed, preserving the exact locked-leg bid/ask/last_price inputs."
  - "Anchor logic remains pure and storage remains isolated from the compute path."
  - "Focused tests cover exact leg-field capture and persistence to Redis plus cold JSONL."
  - "Live restart confirmed the remaining ATM blocker was endpoint selection: calc_indexes() rows for the anchor legs expose IV/OI but no last_done/volume/turnover."
  - "This session adds a bounded option_quote repair helper, wires it into IVBaselineSync and FeedOrchestrator, and front-loads restored anchor symbols into mandatory_symbols during lifespan startup."
  - "Live sampling showed ATM values were valid but numerically flat; frontend chart stalling was caused by dashboardStore replacing same-value ticks instead of appending newer timestamps."
  - "This round prevents non-positive WS prices from overwriting recovered anchor-leg quotes and suppresses flat opening 0/0/0 ATM ticks until the first post-lock move."
  - "Online sampling after the WS-price guard showed source_version advancing again after restart instead of immediately flattening."
  - "Restore and deferred-restore now discard persisted anchors when their latest same-lock ATM history point is a flat 0/0/0 row."
  - "The live 10:56:47 ET bad anchor was explicitly removed from Redis and cold storage; after restart the backend served atm=null instead of restoring that stale platform."
  - "Intraday startup now attempts a bootstrap ATM lock from the initial fetch_chain snapshot so same-day startup does not defer lock capture to a later warm-up phase or the next trade date."
  - "Startup bootstrap now uses unfiltered raw-store snapshots plus a bounded retry window; live restart confirmed a fresh same-day anchor at 11:32:26 ET, but the first ATM decay sample still did not persist."
  - "Startup orchestration now forces a one-shot anchor-leg repair plus immediate ATM decay recompute after same-day bootstrap lock, so first-sample persistence no longer has to wait for the background management loop."
  - "Startup orchestration now also forces an immediate mandatory subscription refresh and unconditional recompute, but fresh online restarts at 11:50 ET and 11:55 ET still produced same-day anchors with empty ATM history and atm=null."


