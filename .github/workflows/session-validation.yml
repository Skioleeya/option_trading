name: Session Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active session (strict)
        shell: bash
        run: |
          python3 ./manage.py check-layer-boundaries
          python3 ./manage.py validate-session --strict

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          diag_dir="tmp/session_validation_diag"
          mkdir -p "$diag_dir"

          echo "---- notes/context/project_state.md ----"
          cat notes/context/project_state.md || true
          echo "---- notes/context/open_tasks.md ----"
          cat notes/context/open_tasks.md || true
          echo "---- notes/context/handoff.md ----"
          cat notes/context/handoff.md || true

          cp notes/context/project_state.md "$diag_dir/context_project_state.md" 2>/dev/null || true
          cp notes/context/open_tasks.md "$diag_dir/context_open_tasks.md" 2>/dev/null || true
          cp notes/context/handoff.md "$diag_dir/context_handoff.md" 2>/dev/null || true

          rel="$(sed -nE 's/^- Path:[[:space:]]+`?(.+)\/project_state\.md`?$/\1/p' notes/context/project_state.md | head -n1)"
          if [ -n "$rel" ] && [ -d "$rel" ]; then
            cp "$rel/project_state.md" "$diag_dir/session_project_state.md" 2>/dev/null || true
            cp "$rel/open_tasks.md" "$diag_dir/session_open_tasks.md" 2>/dev/null || true
            cp "$rel/handoff.md" "$diag_dir/session_handoff.md" 2>/dev/null || true
            cp "$rel/meta.yaml" "$diag_dir/session_meta.yaml" 2>/dev/null || true
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-validation-diagnostics
          path: tmp/session_validation_diag
